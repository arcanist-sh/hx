[workspace]
resolver = "2"
members = [
    "crates/hx-cli",
    "crates/hx-core",
    "crates/hx-config",
    "crates/hx-lock",
    "crates/hx-toolchain",
    "crates/hx-cabal",
    "crates/hx-cache",
    "crates/hx-doctor",
    "crates/hx-ui",
    "crates/hx-telemetry",
    "crates/hx-warnings",
    "crates/hx-solver",
    "crates/hx-lsp",
    "crates/hx-plugins",
    "crates/hx-compiler",
    "crates/hx-bhc",
    "crates/hx-registry",
]

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/arcanist-sh/hx"
authors = ["Raffael Schneider <raffaelschneider@users.noreply.github.com>"]
keywords = ["haskell", "toolchain", "build", "cabal", "ghc"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"

[workspace.dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.3"

# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
# ghcup metadata (YAML with anchors); yaml-rust2 is maintained, pure Rust,
# and resolves aliases while loading.
yaml-rust2 = { version = "0.13", default-features = false }

# Async
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# UI
indicatif = "0.18"
console = "0.16"
owo-colors = "4"
anstream = "1"

# Hashing (used through `hx_core::hash`)
sha2 = "0.11"

# Paths
directories = "6"

# HTTP
# Every client is built by `hx_core::http`. reqwest's `rustls` feature selects
# aws-lc-rs, a C build the cross-compiled release targets would then need, so
# hx takes `rustls-no-provider` and installs rustls's pure-Rust `ring` provider
# itself. Roots: the platform verifier (OS trust store) merged with the Mozilla
# bundle from webpki-root-certs, so minimal containers without a CA store work.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-root-certs = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
which = "8"
postcard = { version = "1", default-features = false, features = ["use-std"] }
once_cell = "1"
# hx downloads and verifies the release itself; self_update only extracts and
# swaps the binary. It needs an HTTP backend to compile: ureq (rustls + ring),
# because its reqwest backend selects aws-lc-rs, a C build that the
# cross-compiled release targets would then need.
self_update = { version = "1", default-features = false, features = ["ureq", "rustls", "archive-tar", "archive-zip", "compression-tar-gz", "compression-zip-deflate"] }

# Archive creation
tar = "0.4"
flate2 = "1"
zip = "9"
hex = "0.4"
ed25519-dalek = { version = "3", features = ["pkcs8"] }

# Workspace crates
hx-core = { version = "0.10.0", path = "crates/hx-core" }
hx-config = { version = "0.10.0", path = "crates/hx-config" }
hx-lock = { version = "0.10.0", path = "crates/hx-lock" }
hx-toolchain = { version = "0.10.0", path = "crates/hx-toolchain" }
hx-cabal = { version = "0.10.0", path = "crates/hx-cabal" }
hx-cache = { version = "0.10.0", path = "crates/hx-cache" }
hx-doctor = { version = "0.10.0", path = "crates/hx-doctor" }
hx-ui = { version = "0.10.0", path = "crates/hx-ui" }
hx-telemetry = { version = "0.10.0", path = "crates/hx-telemetry" }
hx-warnings = { version = "0.10.0", path = "crates/hx-warnings" }
hx-solver = { version = "0.10.0", path = "crates/hx-solver" }
hx-ls = { version = "0.10.0", path = "crates/hx-lsp" }
hx-plugins = { version = "0.10.0", path = "crates/hx-plugins" }
hx-compiler = { version = "0.10.0", path = "crates/hx-compiler" }
hx-bhc = { version = "0.10.0", path = "crates/hx-bhc" }
hx-registry = { version = "0.10.0", path = "crates/hx-registry" }

# Async trait
async-trait = "0.1"

# Testing
tempfile = "3"
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["filters"] }

# Benchmarking
criterion = "0.8"
