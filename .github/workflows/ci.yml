name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run against an unchanged tree: new RustSec advisories land against
  # the committed Cargo.lock, and runner images and the toolchain's
  # environment move underneath us, without any commit to trigger CI.
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  audit:
    # Fails on any RustSec *vulnerability* in Cargo.lock. Informational
    # advisories (unmaintained, unsound) are reported as warnings but do not
    # fail the job: the five current ones all come from steel-core's
    # dependency tree (hx-plugins) and have no upgrade path yet.
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Cargo.lock
        # Invoke the binary directly rather than via `cargo audit`: going
        # through the rustup proxy would install the pinned toolchain just to
        # read a lockfile.
        run: cargo-audit audit

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --workspace

      - name: Run tests
        # --no-fail-fast so every test binary runs and all failures surface in a
        # single CI run (cargo is otherwise fail-fast between test binaries).
        run: cargo test --locked --workspace --no-fail-fast

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --locked --release --workspace

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build docs
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
