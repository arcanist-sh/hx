name: Submit to winget

# Opens a pull request at microsoft/winget-pkgs that adds a release to the
# `raskell-io.hx` package, using the Windows zip from the GitHub release.
#
# release.yml calls this after publishing a release (a release created with the
# workflow token does not trigger other workflows, so `on: release` would never
# fire). It can also be run by hand for an existing tag.
#
# Needs a repository secret WINGET_TOKEN: a classic token with the
# `public_repo` scope. komac opens the PR from that account's fork of
# microsoft/winget-pkgs (raffaelschneider/winget-pkgs). Without the secret the
# job is skipped with a notice.
# The token is only exposed to this job, which has read-only repository access.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to submit (e.g. v0.11.0)
        required: true
        type: string
    secrets:
      WINGET_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit (e.g. v0.11.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  submit:
    name: Submit ${{ inputs.tag }} to winget
    runs-on: ubuntu-latest
    steps:
      - name: Check for WINGET_TOKEN
        id: token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::WINGET_TOKEN is not set; skipping the winget submission"
          fi

      # komac is what winget-releaser wraps; calling it directly shows its own
      # errors (the wrapper reported every failure as "package does not exist")
      # and lets the version be pinned and checksum-verified.
      - name: Install komac
        if: steps.token.outputs.present == 'true'
        env:
          KOMAC_VERSION: 2.17.1
          KOMAC_SHA256: e694e79cd451afabf47bead66ed34586fef4814f7b94e4b61a098f419978d5d7
        run: |
          curl -fsSL -o komac.tar.gz "https://github.com/russellbanks/Komac/releases/download/v${KOMAC_VERSION}/komac-${KOMAC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${KOMAC_SHA256}  komac.tar.gz" | sha256sum -c -
          tar xzf komac.tar.gz komac
          sudo install -m 0755 komac /usr/local/bin/komac
          komac --version

      - name: Open the winget-pkgs pull request
        if: steps.token.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ inputs.tag }}
          KOMAC_CREATED_WITH: arcanist-sh/hx winget.yml
        run: |
          komac list-versions raskell-io.hx
          komac update raskell-io.hx \
            --version "${TAG#v}" \
            --urls "https://github.com/arcanist-sh/hx/releases/download/${TAG}/hx-${TAG}-x86_64-pc-windows-msvc.zip" \
            --release-notes-url https://github.com/arcanist-sh/hx/blob/main/CHANGELOG.md \
            --submit
