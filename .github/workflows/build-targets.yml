name: Build release targets

# Reusable workflow: builds hx-cli for every platform hx ships a release
# binary for. release.yml calls it with `package: true` on a tag push;
# cross-build.yml calls it on PRs and main so a target that stops building
# (a cross linker change, a dependency that drops musl or Windows support) is
# caught before a release tag, not by it. One definition, so the PR matrix and
# the release matrix cannot diverge.

on:
  workflow_call:
    inputs:
      package:
        description: Package each binary into a release archive and upload it as an artifact.
        type: boolean
        default: false
      cache:
        description: Use Swatinem/rust-cache (off for releases, so they always build from scratch).
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        if: inputs.cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # PRs restore main's cache but do not save their own, which keeps
          # six per-target caches from crowding out the rest of the repo's.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cross-compilation tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} -p hx-cli
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package (Unix)
        if: inputs.package && matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../hx-${{ github.ref_name }}-${{ matrix.target }}.tar.gz hx
          cd ../../..

      - name: Package (Windows)
        if: inputs.package && matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../hx-${{ github.ref_name }}-${{ matrix.target }}.zip hx.exe
          cd ../../..

      - name: Upload artifact
        if: inputs.package
        uses: actions/upload-artifact@v7
        with:
          name: hx-${{ matrix.target }}
          path: hx-${{ github.ref_name }}-${{ matrix.target }}.*
