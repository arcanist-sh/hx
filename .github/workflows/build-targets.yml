name: Build release targets

# Reusable workflow: builds hx-cli for every platform hx ships a release
# binary for. release.yml calls it with `package: true` on a tag push;
# cross-build.yml calls it on PRs and main so a target that stops building
# (a cross linker change, a dependency that drops musl or Windows support) is
# caught before a release tag, not by it. One definition, so the PR matrix and
# the release matrix cannot diverge.

on:
  workflow_call:
    inputs:
      package:
        description: Package each binary into a release archive and upload it as an artifact.
        type: boolean
        default: false
      cache:
        description: Use Swatinem/rust-cache (off for releases, so they always build from scratch).
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc builds link against glibc 2.28 (Debian 10+, Ubuntu 20.04+,
          # RHEL 8+) via cargo-zigbuild, instead of the runner's own glibc,
          # which would make the binary require whatever ubuntu-latest ships.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            glibc: "2.28"
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            glibc: "2.28"
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        if: inputs.cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # PRs restore main's cache but do not save their own, which keeps
          # six per-target caches from crowding out the rest of the repo's.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install zig (glibc targets)
        if: matrix.glibc
        run: |
          python3 -m pip install --user ziglang==0.13.0
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        if: matrix.glibc
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        if: ${{ !matrix.glibc }}
        run: cargo build --locked --release --target ${{ matrix.target }} -p hx-cli

      - name: Build (glibc ${{ matrix.glibc }})
        if: matrix.glibc
        # zigbuild writes to target/<triple>/release, without the glibc suffix
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}.${{ matrix.glibc }} -p hx-cli

      - name: Check glibc requirement
        if: matrix.glibc
        # Fail if any symbol needs a newer glibc than the one we promise.
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/hx"
          max="$(strings -a "$bin" | grep -oE 'GLIBC_2\.[0-9]+' | sort -t. -k2 -n -u | tail -1)"
          echo "highest glibc symbol version: ${max:-none}"
          need="${max#GLIBC_2.}"
          allowed="${{ matrix.glibc }}"
          if [ -n "$need" ] && [ "$need" -gt "${allowed#2.}" ]; then
            echo "::error::hx requires $max, above the promised glibc ${{ matrix.glibc }}"
            exit 1
          fi

      - name: Package (Unix)
        if: inputs.package && matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../hx-${{ github.ref_name }}-${{ matrix.target }}.tar.gz hx
          cd ../../..

      - name: Package (Windows)
        if: inputs.package && matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../hx-${{ github.ref_name }}-${{ matrix.target }}.zip hx.exe
          cd ../../..

      - name: Upload artifact
        if: inputs.package
        uses: actions/upload-artifact@v7
        with:
          name: hx-${{ matrix.target }}
          path: hx-${{ github.ref_name }}-${{ matrix.target }}.*
