name: Set up Rust
description: >
  Install the Rust toolchain pinned in rust-toolchain.toml. Every workflow goes
  through this action so CI can never drift from the pin developers build with.

inputs:
  components:
    description: Extra rustup components (comma-separated), e.g. "clippy, rustfmt".
    required: false
    default: ""
  targets:
    description: Extra compilation targets (comma-separated).
    required: false
    default: ""

outputs:
  toolchain:
    description: The toolchain channel read from rust-toolchain.toml.
    value: ${{ steps.channel.outputs.toolchain }}

runs:
  using: composite
  steps:
    - name: Read toolchain channel
      id: channel
      shell: bash
      run: |
        set -euo pipefail
        channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml)"
        if [ -z "$channel" ]; then
          echo "::error file=rust-toolchain.toml::could not read the toolchain channel"
          exit 1
        fi
        echo "Rust toolchain from rust-toolchain.toml: $channel"
        echo "toolchain=$channel" >> "$GITHUB_OUTPUT"
        # Install the file's components with the toolchain. Otherwise the
        # first cargo call makes rustup add them on the fly, which can race
        # with binaries already in place ("detected conflict: bin/cargo-fmt").
        pinned="$(sed -nE 's/^[[:space:]]*components[[:space:]]*=[[:space:]]*\[(.*)\].*/\1/p' rust-toolchain.toml | tr -d '" ' )"
        extra="$(echo "${{ inputs.components }}" | tr -d ' ')"
        components="$(printf '%s,%s' "$pinned" "$extra" | tr ',' '\n' | sed '/^$/d' | sort -u | paste -sd, -)"
        echo "components: ${components:-none}"
        echo "components=$components" >> "$GITHUB_OUTPUT"

    - name: Install Rust ${{ steps.channel.outputs.toolchain }}
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.channel.outputs.toolchain }}
        components: ${{ steps.channel.outputs.components }}
        targets: ${{ inputs.targets }}
