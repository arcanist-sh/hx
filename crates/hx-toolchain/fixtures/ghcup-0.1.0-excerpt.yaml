# Excerpt of ghcup-0.1.0.yaml (https://github.com/haskell/ghcup-metadata),
# trimmed for hx-toolchain tests: a few GHC/Cabal/HLS releases, with the
# anchors, aliases, version ranges, dlOutput and old-format entries intact.
# A_32 and FreeBSD downloads and source/test tarballs are removed.
.hls-install-spec:
  dlInstallSpec: &hls-install-spec-make
    make:
      makeArgs:
      - DESTDIR=${TMPDIR}
      - PREFIX=${PREFIX}
      - install
    exeSymLinked:
    - linkName: "${TARGETFN}-${PKGVER}"
      pVPMajorLinks: false
      setName: "${TARGETFN}"
      targetPattern: ["bin/haskell-language-server-wrapper*"]
    - linkName: "${TARGETFN}~${PKGVER}"
      pVPMajorLinks: false
      setName: "${TARGETFN}"
      targetPattern: ["bin/haskell-language-server-*"]
      targetPatternIgnore: ["bin/haskell-language-server-wrapper*"]
    preserveMtimes: false

.hls-install-spec-win:
  dlInstallSpec: &hls-install-spec-bin
    exeRules:
      - installPattern: ["haskell-language-server-*"]
    exeSymLinked:
    - linkName: "${TARGETFN}-${PKGVER}"
      pVPMajorLinks: false
      setName: "${TARGETFN}"
      targetPattern: ["haskell-language-server-wrapper*"]
    - linkName: "${TARGETFN}~${PKGVER}"
      pVPMajorLinks: false
      setName: "${TARGETFN}"
      targetPattern: ["haskell-language-server-*"]
      targetPatternIgnore: ["haskell-language-server-wrapper*"]
    preserveMtimes: false

